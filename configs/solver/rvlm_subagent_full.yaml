_target_: docvqa.solvers.rvlm_subagent_full_solver.create_rvlm_subagent_full_program
dataset: ${data.dataset}
profile_name: null
max_iterations: 25
subagent_max_iterations: 4
vlm: ${vlm}
rlm_type: lean
subagent_rlm_type: lean
page_factor: 1.5
question_concurrency: 4
# Each "batch" element is now a FULL sub-agent, not a cheap VLM forward, so cap the
# parallel fan-out hard (the prompt also tells the agent to delegate sparingly).
batch_concurrency: 3
